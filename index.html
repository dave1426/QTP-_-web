<html lang="en">

  <title>QTP Web | Elite Website Design & Development</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #fff; }
    
    .hero {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      padding: 100px 20px;

      border-bottom: 2px solid #D4AF37;
    }
    .hero h1 { 
      font-size: 3rem; 
      background: linear-gradient(90deg, #D4AF37, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .hero p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }
    .cta { 
      background: #D4AF37;

      display: inline-block;
    }
    .tag { color: #D4AF37; font-size: 0.9rem; letter-spacing: 2px; }
    
    .section { padding: 80px 20px; max-width: 1100px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
    .card { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #222; }
    .card h3 { color: #D4AF37; margin-bottom: 10px; }
    
    footer { text-align: center; padding: 40px 20px; border-top: 1px solid #222; color: #666; }
  </style>
</head>
